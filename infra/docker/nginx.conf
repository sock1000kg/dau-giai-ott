server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # OCI upload contract allows up to 256 MiB (src/platform/api/src/modules/submissions/routes.ts:16, :152).
    # With 1 MiB headroom: 257M.
    client_max_body_size 257M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Dedicated healthcheck endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Reverse proxy for API routes: dynamic Docker DNS resolver re-resolves backend IP
    # every 5s when API container restarts during demo scenarios to prevent 502 Bad Gateway.
    # Note: API_UPSTREAM must not contain a URI path part (scheme://host:port only).
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $upstream_api "${API_UPSTREAM}";

    location /api/v1/ {
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static snapshot artifacts served from mounted directory /srv/snapshots/
    # (Written by coordinator; read by frontend via /snapshots/latest.json and /snapshots/*.json).
    # If the mounted directory is empty or the file is missing, fall back to 404.
    location /snapshots/ {
        alias /srv/snapshots/;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Long cache for Vite hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Force attachment download with proper tar mime type for pre-built OCI bot tars
    location ~ \.oci\.tar$ {
        default_type application/x-tar;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Explicit no-cache for index.html SPA entrypoint
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # SPA routing fallback: send all other requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
